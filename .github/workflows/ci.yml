name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Publish web app
        run: dotnet publish src/WebApp/WebApp.csproj -c Release --no-build -o out/webapp

      - name: Publish integration
        run: dotnet publish src/Integration/Integration.csproj -c Release --no-build -o out/integration

      - name: Upload web app artifact
        uses: actions/upload-artifact@v7
        with:
          name: webapp
          path: out/webapp
          if-no-files-found: error

      - name: Upload integration artifact
        uses: actions/upload-artifact@v7
        with:
          name: integration
          path: out/integration
          if-no-files-found: error

  deploy-test:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: test
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download web app artifact
        uses: actions/download-artifact@v8
        with:
          name: webapp
          path: webapp

      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to test
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-mmpipe-test
          package: webapp

      - name: Health check
        run: curl --fail --retry 12 --retry-delay 10 --retry-all-errors https://app-mmpipe-test.azurewebsites.net/health
